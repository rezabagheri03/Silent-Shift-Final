services:
  - type: web
    name: silent-shift
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    # On boot: link persistent disk dirs, seed DB if empty, start server
    startCommand: |
      mkdir -p /var/data/db /var/data/uploads/covers /var/data/uploads/audio
      rm -rf data public/uploads
      ln -s /var/data/db data
      ln -s /var/data/uploads public/uploads
      npm run seed
      npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TRUST_PROXY
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
