services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: silent-shift:latest
    container_name: silent-shift
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - TRUST_PROXY=true
      # Required. Compose exits before startup when any value is missing.
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET to a random 32+ character value}
      - ADMIN_USERNAME=${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD (12+ characters)}
    volumes:
      # Persist the SQLite database across container restarts
      - app-data:/app/data
      # Persist uploaded covers and audio
      - app-uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  app-data:
  app-uploads:
